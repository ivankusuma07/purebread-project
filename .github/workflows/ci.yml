name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Builds, starts and records every test: video, trace, screenshot.
      - run: pnpm e2e
      - name: Upload Playwright recordings and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            e2e/results
            e2e/report
          # 90 days for main and edition releases, 30 for pull requests.
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 30 }}
